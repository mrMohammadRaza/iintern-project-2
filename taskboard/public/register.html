<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskBoard - Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5zm3 2v10h2V7H7zm4 0v6h2V7h-2zm4 0v8h2V7h-2z"/>
        </svg>
      </div>
      <h1>Get Started</h1>
      <p>Create your TaskBoard account in seconds</p>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label for="register-name">Full Name</label>
        <input 
          type="text" 
          id="register-name" 
          class="form-control" 
          placeholder="e.g. Sarah Connor" 
          required 
          autocomplete="name"
        >
      </div>

      <div class="form-group">
        <label for="register-email">Email Address</label>
        <input 
          type="email" 
          id="register-email" 
          class="form-control" 
          placeholder="name@example.com" 
          required 
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="register-password">Password (min. 6 characters)</label>
        <input 
          type="password" 
          id="register-password" 
          class="form-control" 
          placeholder="••••••••" 
          required 
          minlength="6"
          autocomplete="new-password"
        >
      </div>

      <button type="submit" id="btn-register-submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
        Create Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.875rem; color: var(--text-muted);">
      Already have an account? <a href="/login.html">Sign in here</a>
    </div>
  </div>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
