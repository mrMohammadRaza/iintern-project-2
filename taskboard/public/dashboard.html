<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskBoard - Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Top App Navigation -->
  <header class="app-nav">
    <a href="/dashboard.html" class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5zm3 2v10h2V7H7zm4 0v6h2V7h-2zm4 0v8h2V7h-2z"/>
        </svg>
      </div>
      <span class="brand-name">TaskBoard</span>
    </a>

    <div class="nav-actions">
      <div class="user-badge" id="nav-user-badge">
        <div class="user-avatar" id="nav-user-avatar">--</div>
        <span class="user-name" id="nav-user-name">Loading...</span>
      </div>
      <button id="btn-logout" class="btn btn-ghost btn-sm" title="Sign Out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Sign Out
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="dashboard-container">
    <div class="dashboard-header">
      <div>
        <h1>My Workspaces &amp; Boards</h1>
        <p class="dashboard-subtitle">Collaborate in real-time with your team across custom Kanban workflows</p>
      </div>
      <button id="btn-open-create-board" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Create New Board
      </button>
    </div>

    <!-- Boards Grid -->
    <div id="boards-grid" class="boards-grid">
      <!-- Dynamically populated via dashboard.js -->
      <div style="grid-column: 1 / -1; text-align: center; padding: 48px; color: var(--text-muted);">
        Loading your boards...
      </div>
    </div>
  </main>

  <!-- Create Board Modal -->
  <div id="create-board-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Create New Board</h2>
        <button class="modal-close" id="btn-close-create-board">&times;</button>
      </div>
      <form id="create-board-form">
        <div class="modal-body">
          <div class="form-group">
            <label for="board-name-input">Board Name *</label>
            <input 
              type="text" 
              id="board-name-input" 
              class="form-control" 
              placeholder="e.g. Q4 Growth Strategy, Mobile App Sprint" 
              required
            >
          </div>
          <div class="form-group">
            <label for="board-desc-input">Description (optional)</label>
            <textarea 
              id="board-desc-input" 
              class="form-control" 
              placeholder="Brief description of goals, milestones, or team focus..."
            ></textarea>
          </div>
          <p style="font-size: 0.8rem; color: var(--text-faint);">
            💡 Default workflow columns (<strong>To Do</strong>, <strong>In Progress</strong>, and <strong>Done</strong>) will be configured automatically.
          </p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btn-cancel-create-board">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-submit-create-board">Create Board</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
